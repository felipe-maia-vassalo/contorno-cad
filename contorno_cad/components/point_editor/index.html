<!doctype html><html lang="pt-BR"><meta charset="utf-8"><style>body{font:14px system-ui;color:#21314a;margin:0}canvas{border:1px solid #becbd8;border-radius:8px;touch-action:none;max-width:100%;cursor:crosshair}button,select{padding:8px;margin:4px;border:1px solid #bccad8;border-radius:5px;background:#f6f9fc;color:#14283c}p{margin:5px 0}button.primary{background:#0c6470;color:white}</style><body><p id="help"></p><div><select id="action"><option value="select">Selecionar / mover ponto</option><option value="add">Adicionar ponto</option><option value="calibrate">Marcar os dois pontos de calibração</option></select><button id="remove">Remover selecionado</button><button id="clear">Limpar perfil</button><button id="apply" class="primary">Aplicar pontos à etapa</button></div><canvas id="canvas"></canvas><p id="status"></p><script>
const canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d'), status=document.getElementById('status');let args={},points=[],cal=[],img=new Image(),selected=-1,drag=false,scale=1,lastRevision=null;

const labels={
pt:{select:'Selecionar / mover ponto',add:'Adicionar ponto',calibrate:'Marcar os dois pontos de calibração',remove:'Remover selecionado',clear:'Limpar perfil',apply:'Aplicar pontos à etapa',help:'Clique na fotografia para adicionar pontos ou marcar a calibração. Arraste um ponto para corrigi-lo. As linhas mostram a ordem do perfil.',points:'pontos no perfil.',calibration:'pontos de calibração.',selected:'Selecionado:'},
en:{select:'Select / move point',add:'Add point',calibrate:'Mark two calibration points',remove:'Remove selected',clear:'Clear profile',apply:'Apply points to step',help:'Click the photo to add points or mark calibration. Drag a point to edit it. Lines show the profile point order.',points:'profile points.',calibration:'calibration points.',selected:'Selected:'}
};
function localizedLabels(){return labels[args.language==='en'?'en':'pt']}
function updateLabels(){const copy=localizedLabels();document.documentElement.lang=args.language==='en'?'en':'pt-BR';for(const option of document.getElementById('action').options)option.textContent=copy[option.value];for(const id of ['remove','clear','apply'])document.getElementById(id).textContent=copy[id];document.getElementById('help').textContent=copy.help;}

function send(type,extra={}){parent.postMessage({isStreamlitMessage:true,type,...extra},'*')}
function draw(){if(!img.width)return;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);ctx.lineWidth=2;ctx.strokeStyle='#00edb8';ctx.beginPath();points.forEach((p,i)=>{const x=p.x*scale,y=p.y*scale;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});if(args.closed&&points.length>2)ctx.closePath();ctx.stroke();points.forEach((p,i)=>{ctx.beginPath();ctx.fillStyle=i===selected?'#ffb238':'#0038ee';ctx.arc(p.x*scale,p.y*scale,5,0,2*Math.PI);ctx.fill();ctx.fillStyle='#002f56';ctx.fillText(i+1,p.x*scale+7,p.y*scale-5)});ctx.strokeStyle='#ffbf00';ctx.beginPath();cal.forEach((p,i)=>{let x=p[0]*scale,y=p[1]*scale;i?ctx.lineTo(x,y):ctx.moveTo(x,y);ctx.fillStyle='#ffbf00';ctx.fillRect(x-5,y-5,10,10)});ctx.stroke();if(args.axis_x!=null){ctx.setLineDash([7,5]);ctx.strokeStyle='#00c5ff';ctx.beginPath();ctx.moveTo(args.axis_x*scale,0);ctx.lineTo(args.axis_x*scale,canvas.height);ctx.stroke();ctx.setLineDash([])}const copy=localizedLabels();status.textContent=points.length+' '+copy.points+' '+cal.length+'/2 '+copy.calibration+' '+(selected>=0?copy.selected+' '+(selected+1):'');}
function xy(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width/scale,y:(e.clientY-r.top)*canvas.height/r.height/scale}}
canvas.onpointerdown=e=>{let p=xy(e),action=document.getElementById('action').value;if(action==='calibrate'){if(cal.length===2)cal=[];cal.push([p.x,p.y]);}else if(action==='add'){points.push({...p,kind:'line'});selected=points.length-1}else{let best=15/scale;selected=-1;points.forEach((v,i)=>{let d=Math.hypot(v.x-p.x,v.y-p.y);if(d<best){best=d;selected=i}});drag=selected>=0;canvas.setPointerCapture(e.pointerId)}draw()};canvas.onpointermove=e=>{if(drag){points[selected]={...points[selected],...xy(e)};draw()}};canvas.onpointerup=()=>drag=false;
document.getElementById('remove').onclick=()=>{if(selected>=0){points.splice(selected,1);selected=-1;draw()}};document.getElementById('clear').onclick=()=>{points=[];selected=-1;draw()};document.getElementById('apply').onclick=()=>send('streamlit:setComponentValue',{value:{points,calibration:cal,event_id:Date.now()},dataType:'json'});
window.addEventListener('message',e=>{if(e.data.type!=='streamlit:render')return;args=e.data.args;if(lastRevision!==args.revision){points=structuredClone(args.points||[]);cal=structuredClone(args.calibration||[]);selected=-1;lastRevision=args.revision}updateLabels();img.onload=()=>{scale=Math.min(1,900/img.width,650/img.height);canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);draw();send('streamlit:setFrameHeight',{height:canvas.height+135})};if(img.src!==args.image)img.src=args.image;else img.onload();});send('streamlit:componentReady',{apiVersion:1});
</script></body></html>
